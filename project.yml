# Herald project spec — xcodegen owns Herald.xcodeproj (generated, gitignored). This file is the
# source of truth; regenerate with `xcodegen generate` (build-detached.sh does it automatically).
name: Herald
options:
  bundleIdPrefix: com.wizemann
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.45.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3Q6X2L86C4
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

configs:
  Debug: debug
  Release: release

packages:
  HeraldKit:
    path: HeraldKit
  # Sparkle 2 auto-updater (t-8a1c0026). Sandboxed installs run OUTSIDE the sandbox via
  # Sparkle's bundled Installer XPC service — enabled by SUEnableInstallerLauncherService
  # in the `info:` block below, paired with the -spks/-spki mach-lookup exceptions in
  # Herald/Herald.entitlements. Linking Sparkle needs no signing, so CI (CODE_SIGNING_ALLOWED=NO)
  # is unaffected.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.9.2
  # swift-stats — privacy-first usage analytics (t-e425c325). `Stats` is the core emitter,
  # `StatsCloudflare` the sink for https://api.swiftstats.co, `StatsTesting` the deterministic
  # test seams (InMemorySink, FixedUUIDProvider, FixedRandomSource) used by HeraldTests.
  swift-stats:
    url: https://github.com/awizemann/swift-stats
    from: 0.2.0

targets:
  Herald:
    type: application
    platform: macOS
    sources:
      - path: Herald
    dependencies:
      - package: HeraldKit
      - package: Sparkle
        product: Sparkle
      - package: swift-stats
        product: Stats
      - package: swift-stats
        product: StatsCloudflare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizemann.herald
        PRODUCT_NAME: Herald
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Herald/Herald.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Herald/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.wizemann.herald
            CFBundleURLSchemes: [com.wizemann.herald]
        LSMinimumSystemVersion: "15.0"
        # Everything this app writes came off the network (mail attachments), so it
        # must carry the quarantine flag and get the Gatekeeper prompt on open.
        LSFileQuarantineEnabled: true
        # swift-stats write key. Only the build-setting REFERENCE lives here; the value is
        # supplied per-invocation by scripts/release.sh through a temp xcconfig (never a
        # project setting, never in this file). Dev builds resolve to "" → analytics gated off.
        HeraldStatsWriteKey: $(APP_STATS_WRITE_KEY)

        # ── Sparkle 2 auto-update (t-8a1c0026) ──────────────────────────────────────────
        # These live in the `info:` PLIST (not INFOPLIST_KEY_ build settings) so their TYPES
        # are exact: Sparkle reads SUEnableInstallerLauncherService / SUAutomaticallyUpdate
        # as real Booleans and SUScheduledCheckInterval as a real Integer, but a custom key
        # pushed through INFOPLIST_KEY_ lands as a STRING, which Sparkle may not honor.

        # The appcast feed — appcast.xml on this repo's gh-pages branch (GitHub Pages).
        SUFeedURL: https://awizemann.github.io/herald/appcast.xml

        # EdDSA (ed25519) PUBLIC key that verifies every downloaded update's signature. Not a
        # secret: it ships in every copy and only VERIFIES. The private half is minted once by
        # the owner with `./scripts/sparkle-keys.sh` and lives ONLY in their login Keychain
        # (account "Herald") — never in this repo. Until it is minted this stays the
        # placeholder, and `UpdateService` refuses to construct the updater (see README
        # "Updates"); scripts/release.sh also refuses to release.
        SUPublicEDKey: P6TirI4LP2xBLEmK91S9yMFgwnausk2T/VebkCMtvbQ=

        # Sandbox requirement: install updates via Sparkle's bundled Installer XPC service,
        # which runs outside the sandbox. Paired with the -spks/-spki mach-lookup exceptions
        # in Herald/Herald.entitlements. The Downloader XPC service is deliberately NOT
        # enabled — we hold network.client, so Sparkle downloads in-process.
        SUEnableInstallerLauncherService: true

        # Never install silently: mail is the app the user least wants restarted behind their
        # back. Sparkle still CHECKS on a daily cadence and offers the update.
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
  HeraldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HeraldTests
    dependencies:
      - target: Herald
      - package: swift-stats
        product: StatsTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizemann.herald.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Herald.app/Contents/MacOS/Herald"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Herald:
    build:
      targets:
        Herald: all
        HeraldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeraldTests
        - package: HeraldKit/HeraldKitTests
